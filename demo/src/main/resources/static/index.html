<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="main-container">
        <div class="upload-card">
            <header class="card-header">
                <div class="badge">AI Powered</div>
                <h1>Portfolio Generator</h1>
                <p class="subtitle">Upload your resume. We'll craft a futuristic portfolio for you in seconds.</p>
            </header>

            <form id="uploadForm" class="upload-form">
                
                <div class="drop-zone" id="dropZone">
                    <div class="drop-content">
                        <div class="icon-wrapper">
                            <svg class="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        
                        <p class="drop-text">Drag & drop your resume</p>
                        <p class="limit-text">Supports PDF, DOCX (Max 5MB)</p>
                        
                        <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx" hidden>
                        <button type="button" class="browse-btn" onclick="document.getElementById('fileInput').click()">Browse Files</button>
                    </div>
                </div>

                <div id="filePreview" class="file-preview hidden">
                    <div class="file-info">
                        <div class="file-icon-box">
                            <svg class="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                        <div class="file-details">
                            <span id="fileName" class="filename">resume.pdf</span>
                            <span class="status-ready">Ready to process</span>
                        </div>
                    </div>
                    <button type="button" id="removeFileBtn" class="remove-btn" title="Remove file">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <div id="statusMessage" class="status-message"></div>

                <div class="actions">
                    <button type="submit" id="submitBtn" class="submit-btn" disabled>
                        <span class="btn-text">Generate Website</span>
                        <div class="spinner hidden"></div>
                        <div class="glow-effect"></div>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
